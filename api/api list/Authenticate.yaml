openapi: 3.0.0
info:
  title: authentication
  version: 1.0.0
paths:
  /api/auth/authenticate:
    post:
      summary: Authenticate user
      description: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User email
                password:
                  type: string
                  description: User password
        
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the authentication was successful
                  message:
                    type: string
                    description: A message indicating the result of the authentication
                  token:
                    type: string
                    description: The authentication token
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          description: The UUID of the workspace
                        name:
                          type: string
                          description: The name of the workspace
                        description:
                          type: string
                          description: The description of the workspace
                        current:
                          type: integer
                          description: Indicates if the workspace is the current one
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the workspace
                        updated_at:
                          type: string
                          format: date-time
                          description: The last update date of the workspace
                        deleted_at:
                          type: string
                          format: date-time
                          description: The deletion date of the workspace
                        user_id:
                          type: integer
                          description: The ID of the user associated with the workspace
    servers:
      - url: https://dev.app.budgetcontrol.cloud

  /api/auth/user-info:
    get:
      summary: Get user information
      description: Retrieve user information
      parameters:
        - name: X-ws
          in: header
          description: The UUID of the workspace
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          headers:
            X-Bc-Token:
              description: JWT token with user account
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: The UUID of the user
                      name:
                        type: string
                        description: The name of the user
                      email:
                        type: string
                        description: The email of the user
                      email_verified_at:
                        type: string
                        format: date-time
                        description: The date and time when the email was verified
                      created_at:
                        type: string
                        format: date-time
                        description: The creation date of the user
                      updated_at:
                        type: string
                        format: date-time
                        description: The last update date of the user
                      deleted_at:
                        type: string
                        format: date-time
                        description: The deletion date of the user
                      sub:
                        type: string
                        description: The sub claim of the user
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The ID of the workspace
                        uuid:
                          type: string
                          description: The UUID of the workspace
                        name:
                          type: string
                          description: The name of the workspace
                        description:
                          type: string
                          description: The description of the workspace
                        current:
                          type: integer
                          description: Indicates if the workspace is the current one
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the workspace
                        updated_at:
                          type: string
                          format: date-time
                          description: The last update date of the workspace
                        deleted_at:
                          type: string
                          format: date-time
                          description: The deletion date of the workspace
                        user_id:
                          type: integer
                          description: The ID of the user associated with the workspace
                  current_ws:
                    type: string
                    description: The UUID of the current workspace
                  workspace_settings:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The ID of the workspace setting
                      workspace_id:
                        type: integer
                        description: The ID of the workspace
                      setting:
                        type: string
                        description: The setting name
                      data:
                        type: string
                        description: The setting data
                      created_at:
                        type: string
                        format: date-time
                        description: The creation date of the workspace setting
                      updated_at:
                        type: string
                        format: date-time
                        description: The last update date of the workspace setting
                      deleted_at:
                        type: string
                        format: date-time
                        description: The deletion date of the workspace setting
                  shared_with:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          description: The email of the user the workspace is shared with
                        name:
                          type: string
                          description: The name of the user the workspace is shared with
        

  /api/auth/user-info/by-email/{email}:
    get:
      summary: Get user info by email
      description: Retrieve user information by email address
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /api/auth/authenticate/google:
    get:
      summary: Google OAuth provider
      description: Redirect to Google OAuth authentication
      responses:
        '302':
          description: Redirect to Google OAuth

  /api/auth/sign-up:
    post:
      summary: Sign up
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: "test3"
                email:
                  type: string
                  format: email
                  example: "test3@budgetcontrol.cloud"
                password:
                  type: string
                  example: "SecureP@ssw0rd"
      responses:
        '201':
          description: User created successfully

  /api/auth/{userUuid}/finalize/sign-up:
    post:
      summary: Finalize sign-up
      description: Complete the registration by creating the initial workspace and wallet
      parameters:
        - name: userUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Workspace"
                    currency:
                      type: integer
                      example: 2
                    payment_type:
                      type: integer
                      example: 1
                wallet:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "My Wallet"
                    balance:
                      type: number
                      example: 0
                    type:
                      type: string
                      example: "bank"
                    color:
                      type: string
                      example: "#3dafac"
                    currency:
                      type: integer
                      example: 2
                    exclude_from_stats:
                      type: integer
                      example: 0
      responses:
        '200':
          description: Sign-up finalized successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
