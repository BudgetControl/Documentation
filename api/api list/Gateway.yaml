openapi: 3.0.0
info:
  title: Gateway API
  version: 1.0.0
servers:
  - url: https://dev.app.budgetcontrol.cloud
paths:
  /webhook/clear-cache/{key}/{resource}:
    get:
      summary: Clear cache by key and resource
      description: Invalidate the cache for a specific resource using the provided key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            example: "63639be469727dsasx"
        - name: resource
          in: path
          required: true
          schema:
            type: string
            example: "entry"
      responses:
        '200':
          description: Cache cleared successfully

  /webhook/clear-cache/all:
    get:
      summary: Clear all cache
      description: Invalidate the entire application cache
      responses:
        '200':
          description: All cache cleared successfully

  /api/monitor/debt:
    get:
      summary: Monitor debt
      description: Monitor debt and debit entries across all workspaces
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /api/auth/{userUuid}/finalize/sign-up:
    post:
      summary: Finalize sign-up (Gateway)
      description: Gateway endpoint to complete the user registration process
      parameters:
        - name: userUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "The Workspace"
                    currency:
                      type: integer
                      example: 2
                    payment_type:
                      type: integer
                      example: 2
                wallet:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "New wallet"
                    balance:
                      type: number
                      example: 0.0
                    type:
                      type: string
                      example: "bank"
                    color:
                      type: string
                      example: "#000000"
                    currency:
                      type: integer
                      example: 2
                    exclude_from_stats:
                      type: integer
                      example: 0
      responses:
        '200':
          description: Sign-up finalized successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
