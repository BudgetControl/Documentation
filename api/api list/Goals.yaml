openapi: 3.0.0
info:
  title: Goals API
  version: 1.0.0
servers:
  - url: https://dev.app.budgetcontrol.cloud
paths:
  /api/goals:
    get:
      summary: Get goals list
      description: Retrieve list of goals
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'

    post:
      summary: Create goal
      description: Create a new goal
      parameters:
        - name: X-Bc-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
      responses:
        '201':
          description: Goal created successfully

  /api/goals/{uuid}:
    get:
      summary: Get goal by UUID
      description: Retrieve a specific goal by UUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Bc-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'

    put:
      summary: Update goal
      description: Update an existing goal
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Bc-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
      responses:
        '200':
          description: Goal updated successfully

    delete:
      summary: Delete goal
      description: Delete a goal
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Bc-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Goal deleted successfully

  /api/goals/{uuid}/status:
    patch:
      summary: Update goal status
      description: Update the status of a goal
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Bc-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [complete, incomplete, paused]
      responses:
        '200':
          description: Goal status updated successfully

components:
  schemas:
    Goal:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        current_amount:
          type: number
        due_date:
          type: string
          format: date-time
        category_icon:
          type: string
        status:
          type: string
          enum: [complete, incomplete, paused]
        workspace_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalCreate:
      type: object
      required:
        - name
        - amount
        - due_date
        - category_icon
      properties:
        category_icon:
          type: string
          example: "fa-solid fa-graduation-cap"
        name:
          type: string
          example: "istruzione"
        amount:
          type: string
          example: "1000"
        due_date:
          type: string
          format: date-time
          example: "2028-06-30T14:41:00.000Z"
        description:
          type: string
          example: "test"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
