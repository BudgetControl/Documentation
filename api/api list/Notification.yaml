openapi: 3.0.0
info:
  title: Notification API
  version: 1.0.0
servers:
  - url: https://app.budgetcontrol.cloud
paths:
  /api/notify/external/email/contact:
    post:
      summary: Send contact email
      description: Send email from contact form
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  format: email
                  description: Recipient email address
                subject:
                  type: string
                  description: Email subject
                message:
                  type: string
                  description: Email message content
                name:
                  type: string
                  description: Sender name
                email:
                  type: string
                  format: email
                  description: Sender email
                privacy:
                  type: boolean
                  description: Privacy acceptance flag
      responses:
        '200':
          description: Email sent successfully

  /api/notify/push/token:
    post:
      summary: Register push token
      description: Register device push notification token
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Push notification token
      responses:
        '200':
          description: Token registered successfully

  /api/notify/message:
    post:
      summary: Send notification message
      description: Send a notification message to a user
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: User UUID to notify
                message:
                  type: string
                  description: Message content
                date_time_to_send:
                  type: string
                  format: date-time
                  description: When to send the message
                active:
                  type: boolean
                  description: Message active status
      responses:
        '200':
          description: Message sent successfully

  /api/notify/message/last:
    get:
      summary: Get last messages
      description: Retrieve last notification messages
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Last messages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  /api/notify/email/budget/exceeded:
    post:
      summary: Send budget exceeded notification
      description: Send email notification when budget is exceeded
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  format: email
                  description: Recipient email address
                budget_name:
                  type: string
                  description: Name of the budget
                current_amount:
                  type: string
                  description: Current budget amount
                budget_limit:
                  type: string
                  description: Budget limit amount
                currency:
                  type: string
                  description: Currency code
                username:
                  type: string
                  description: User name
      responses:
        '200':
          description: Budget exceeded notification sent successfully

components:
  schemas:
    Message:
      type: object
      properties:
        id:
          type: integer
          description: Message ID
        uuid:
          type: string
          description: Message UUID
        to:
          type: string
          description: Recipient user UUID
        message:
          type: string
          description: Message content
        date_time_to_send:
          type: string
          format: date-time
          description: Scheduled send time
        active:
          type: boolean
          description: Message active status
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT