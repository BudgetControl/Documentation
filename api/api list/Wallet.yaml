openapi: 3.0.0
info:
  title: Wallet API
  version: 1.0.0
servers:
  - url: https://dev.app.budgetcontrol.cloud
paths:
  /api/wallet/list:
    get:
      summary: Get list of wallets
      description: Retrieve list of wallets
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'

  /api/wallet/create:
    post:
      summary: Create a new wallet
      description: Create a new wallet (bank, voucher, credit card, etc.)
      parameters:
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "wallet"
                color:
                  type: string
                  example: "#e6e632ff"
                invoice_date:
                  type: string
                  format: date-time
                  nullable: true
                closing_date:
                  type: string
                  format: date-time
                  nullable: true
                payment_account:
                  type: integer
                  nullable: true
                type:
                  type: string
                  enum: [bank, voucher, credit-card-revolving, cash, investment]
                  example: "bank"
                installement_value:
                  type: number
                  nullable: true
                currency:
                  type: string
                  example: "2"
                balance:
                  type: string
                  example: "3000.00"
                exclude_from_stats:
                  type: integer
                  example: 0
                voucher_value:
                  type: number
                  description: Required for voucher type
                  nullable: true
                installement:
                  type: integer
                  description: Required for credit card revolving
                  nullable: true
      responses:
        '201':
          description: Wallet created successfully
        '400':
          description: Bad request

  /api/wallet/update/{uuid}:
    put:
      summary: Update wallet
      description: Update an existing wallet
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: X-Bc-Token
          in: header
          description: JWT token with user account
          required: true
          schema:
            type: string
        - name: X-Bc-Ws
          in: header
          description: UUID of the workspace
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUpdate'
      responses:
        '200':
          description: Wallet updated successfully
        '404':
          description: Wallet not found

components:
  schemas:
    Wallet:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        name:
          type: string
        color:
          type: string
        type:
          type: string
        balance:
          type: number
        currency:
          type: string
        exclude_from_stats:
          type: integer
        workspace_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    WalletUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        type:
          type: string
        balance:
          type: string
        currency:
          type: string
        exclude_from_stats:
          type: integer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
